
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>BUDJITO | Budget Tracker v1.0.0</title>

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Authentication -->
  <div id="auth" hidden></div>

  <!-- Main Application -->
  <div id="app" hidden>

    <header class="topbar">
      <div class="topbar-in">

        <div class="brand">
          Budjito
          <small>Ang budget tracker mong petmalu</small>
          <span class="version">VERSION 1.0.0</span>
        </div>

        <div class="who">
          <span class="name" id="whoName"></span>
          <button class="theme-btn js-theme" type="button">
            Light / dark
          </button>
          <button class="theme-btn" type="button" data-act="logout">
            Log out
          </button>
        </div>

      </div>

      <div class="topbar-in">
        <nav class="tabs" id="tabs"
          role="tablist"
          aria-label="Sections">
        </nav>
      </div>
    </header>

    <main class="page" id="view"></main>

  </div>

  <!-- Notifications -->
  <div class="toast" id="toast" hidden></div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Application -->
  <script src="app.js"></script>

</body>
</html>
